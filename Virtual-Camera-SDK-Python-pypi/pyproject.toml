[build-system]
requires=["setuptools>=77","wheel>=0.43"]
build-backend="setuptools.build_meta"
[project]
name="virtual-camera-sdk"
version="1.0.0"
description="Windows x64 Virtual-Camera-SDK direct SDK"
requires-python=">=3.10"
license="MIT"
readme="README.md"
[project.urls]
Repository="https://github.com/titanfyre/Virtual-Camera-SDK"
[tool.setuptools]
packages=["virtual_camera_sdk"]
[tool.setuptools.package-data]
virtual_camera_sdk=["*.dll"]
[tool.setuptools.data-files]
"share/virtual-camera-sdk/docs"=["docs/*","LICENSE"]
